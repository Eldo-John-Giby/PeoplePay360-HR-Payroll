services:
  db:
    image: postgres:16-alpine
    container_name: peoplepay-db
    environment:
      POSTGRES_USER: peoplepay
      POSTGRES_PASSWORD: peoplepay
      POSTGRES_DB: peoplepay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peoplepay -d peoplepay"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: peoplepay-app
    environment:
      DATABASE_URL: postgresql+psycopg2://peoplepay:peoplepay@db:5432/peoplepay
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me-in-production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_MINUTES: 10080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Migrate + seed (idempotent) on boot so `docker compose up` is a full demo.
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed.seed_data &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata: